# Server Configuration
server.port=8080
spring.application.name=medical-store-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/medical_store_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Default Initial Administrator Configuration
app.default-admin.name=System Administrator
app.default-admin.email=${ADMIN_EMAIL:admin@medstore.com}
app.default-admin.password=${ADMIN_PASSWORD}
app.default-admin.phone=+91 98110 00001
app.default-admin.store-name=City Care Pharmacy